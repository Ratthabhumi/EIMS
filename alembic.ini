# ==============================================================================
# EIMS Alembic Asynchronous Migrations Configuration
# Governed under EIMS Documentation System (EDS v1.0.0)
# ==============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
output_encoding = utf-8
truncate_slug_length = 40
upgrade_token = REVISION_UPGRADE
downgrade_token = REVISION_DOWNGRADE

# Database URL is overridden dynamically at runtime by Pydantic settings in env.py
# Using placeholder string to avoid credentials leakage in static version control.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Post-processing hooks for generated migration scripts can be registered here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
