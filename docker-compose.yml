# ==============================================================================
# EIMS Local Infrastructure Dev Stack
# Governed by EIMS Documentation System (EDS v1.0.0)
# Core Law 3 (SAD) & Core Law 4 (Database Design) Compliance
#
# Profiles (Compose v2+ / Docker Compose v5.x):
#   (default / no profile)  postgres, redis, minio  — Local Core
#   observability           prometheus, grafana
#   pooler                  pgbouncer
#   full                    observability + pooler (with Core)
#
# Loki removed from active runtime (no in-repo consumer). Historical evidence
# documents may still mention it; do not reintroduce without a log shipper.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Asset Registry Persistence Engine  (Local Core — always on)
  # ----------------------------------------------------------------------------
  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: eims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eims_registry
      POSTGRES_USER: eims_user
      POSTGRES_PASSWORD: eims_secret_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eims_user -d eims_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # PgBouncer — optional pooler profile (app default uses PostgreSQL :5432)
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: eims-pgbouncer
    restart: unless-stopped
    profiles: ["pooler", "full"]
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://eims_user:eims_secret_password@postgres_db:5432/eims_registry"
      POOL_MODE: "transaction"
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: "plain"
      AUTH_USER: "eims_user"
      AUTH_PASS: "eims_secret_password"
    ports:
      - "127.0.0.1:6432:5432"

  # ----------------------------------------------------------------------------
  # Redis 7 — Local Core (streams, workers, pub/sub, cache)
  # ----------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: eims-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO S3 — Local Core (OCR / EVTX objects)
  # ----------------------------------------------------------------------------
  minio_s3:
    image: minio/minio:latest
    container_name: eims-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eims_minio_admin
      MINIO_ROOT_PASSWORD: eims_minio_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio_setup:
    image: minio/mc:latest
    container_name: eims-minio-setup
    depends_on:
      minio_s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set eims_local http://minio_s3:9000 eims_minio_admin eims_minio_secret;
      /usr/bin/mc mb eims_local/eims-ocr-manifests --ignore-existing;
      /usr/bin/mc anonymous set private eims_local/eims-ocr-manifests;
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # Observability — part of default local startup (owner: open Grafana/Prometheus
  # immediately after start_eims.bat). Still stoppable via stop_eims_observability.bat.
  # Profiles `observability` / `full` retained for explicit tooling; services have no
  # required profile so plain `docker compose up` includes them.
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: eims-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployments/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_storage:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: eims-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=eims_admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./deployments/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/observability/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  postgres_storage:
    driver: local
  redis_storage:
    driver: local
  minio_storage:
    driver: local
  prometheus_storage:
    driver: local
  grafana_storage:
    driver: local
