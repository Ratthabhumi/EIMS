# ==============================================================================
# EIMS Standalone Homelab Infrastructure Compose Stack
# Governed by EIMS Documentation System (EDS v1.0.0)
#
# USAGE:
#   docker compose -f docker-compose.homelab.yml --env-file .env.homelab up -d
#
# HARDENING HIGHLIGHTS:
#   1. Loopback-only port bindings (127.0.0.1) for all backing services.
#      Prevents direct LAN exposure of PostgreSQL, PgBouncer, Redis, MinIO,
#      Prometheus, Loki, and Grafana.
#   2. Dynamic credential interpolation via .env.homelab variables.
#   3. Private MinIO bucket (no public anonymous access).
# ==============================================================================

services:
  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: eims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EIMS_DB_NAME:-eims_registry}
      POSTGRES_USER: ${EIMS_DB_USER:-eims_user}
      POSTGRES_PASSWORD: ${EIMS_DB_PASSWORD:?EIMS_DB_PASSWORD is required in homelab}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EIMS_DB_USER:-eims_user} -d ${EIMS_DB_NAME:-eims_registry}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: eims-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${EIMS_DB_USER:-eims_user}:${EIMS_DB_PASSWORD}@postgres_db:5432/${EIMS_DB_NAME:-eims_registry}"
      POOL_MODE: "transaction"
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: "plain"
      AUTH_USER: ${EIMS_DB_USER:-eims_user}
      AUTH_PASS: ${EIMS_DB_PASSWORD}
    ports:
      - "127.0.0.1:6432:6432"

  redis_cache:
    image: redis:7-alpine
    container_name: eims-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio_s3:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: eims-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${EIMS_MINIO_ACCESS_KEY:-eims_minio_admin}
      MINIO_ROOT_PASSWORD: ${EIMS_MINIO_SECRET_KEY:?EIMS_MINIO_SECRET_KEY is required in homelab}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio_setup:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: eims-minio-setup
    depends_on:
      minio_s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set eims_local http://minio_s3:9000 $${MINIO_ROOT_USER:-eims_minio_admin} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb eims_local/$${EIMS_MINIO_BUCKET_NAME:-eims-ocr-manifests} --ignore-existing;
      /usr/bin/mc anonymous set none eims_local/$${EIMS_MINIO_BUCKET_NAME:-eims-ocr-manifests};
      exit 0;
      "

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: eims-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployments/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_storage:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: eims-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-eims_admin}
    volumes:
      - grafana_storage:/var/lib/grafana

  loki:
    image: grafana/loki:3.2.0
    container_name: eims-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  postgres_storage:
    driver: local
  redis_storage:
    driver: local
  minio_storage:
    driver: local
  prometheus_storage:
    driver: local
  grafana_storage:
    driver: local
