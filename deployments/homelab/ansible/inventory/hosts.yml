---
# ==============================================================================
# ANSIBLE INVENTORY: INFRASTRUCTURE TOPOLOGY
# Single Source of Truth for all hardware nodes across our network
# ==============================================================================
all:
  children:
    # --------------------------------------------------------------------------
    # CORE HOME LAB SERVERS (24/7 Always-On Control Plane & Compute)
    # --------------------------------------------------------------------------
    home_servers:
      hosts:
        homelab:
          ansible_host: homelab           # Resolvable via Tailscale & local SSH config
          ansible_user: mew
          os_version: ubuntu_24_04
          role_tag: "control-plane,ingress,sre-monitor"
          is_24_7: true
          hardware_model: "Acer Aspire V13"

    # --------------------------------------------------------------------------
    # AI WORKSTATIONS & EXPOSED GPU CLUSTERS (Future ~60k THB mATX build)
    # --------------------------------------------------------------------------
    ai_workstations:
      hosts:
        ai_server:
          ansible_host: ai-server.homelab.ts.net   # Placeholder for incoming hardware
          ansible_user: mew
          os_version: linux_bare_metal_or_proxmox
          role_tag: "gpu-compute,ollama-inference,ai-agents"
          is_24_7: false
          hardware_model: "Custom mATX Desktop (~60k THB)"

    # --------------------------------------------------------------------------
    # GROUP VARIABLES (Applied globally across nodes)
    # --------------------------------------------------------------------------
  vars:
    ansible_python_interpreter: /usr/bin/python3
    tailscale_network: true
    default_timezone: "Asia/Bangkok"
