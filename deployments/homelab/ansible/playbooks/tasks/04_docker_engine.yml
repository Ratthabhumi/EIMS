---
# ==============================================================================
# PHASE 4: OFFICIAL DOCKER ENGINE PROVISIONING & SRE LOG ROTATION PRE-VENTIONS
# ==============================================================================

- name: Create general keyrings storage directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download official Docker repository GPG signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true

- name: Register official Docker Apt repository with dynamic architectural detection
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install official Docker CE, Containerd, and Compose plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure target administrative users are appended to the 'docker' permission group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Configure Docker daemon JSON with defensive log rotation (Prevent disk exhaustion)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "live-restore": true
      }
    mode: '0644'
  notify: Restart Docker Daemon

- name: Enable and boot Docker engine natively
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
