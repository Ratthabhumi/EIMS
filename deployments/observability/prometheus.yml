global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "eims_fastapi"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    # We will add a /metrics endpoint to FastAPI if we install prometheus_fastapi_instrumentator
