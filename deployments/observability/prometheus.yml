global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Host API (uvicorn on the Windows host). Docker Desktop resolves host.docker.internal.
  - job_name: "eims_fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: eims-core-api
